<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPod Classic Simulator - Offline & Low Power Edition</title>
  
  <!-- Tailwind CSS (캐시를 통해 오프라인 구동 지원) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (캐시를 통해 오프라인 구동 지원) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 시스템 테마(라이트/다크 모드)에 따른 단색 배경 적용 */
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      overscroll-behavior-y: none;
      overflow: hidden; /* 스크롤 방지 및 화면 밖 요소 숨김 */
      -webkit-user-select: none;
      user-select: none;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111111;
      }
    }

    /* --- 초현실적 재질감 CSS --- */
    .device-body {
      background: radial-gradient(circle at 30% 10%, #FFFFFF 0%, #E2E4E6 30%, #AAB0B6 85%, #8C9298 100%);
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.9),
        inset -3px -3px 6px rgba(0, 0, 0, 0.25),
        inset 6px 6px 15px rgba(255, 255, 255, 0.6),
        inset -6px -6px 20px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(160, 160, 160, 0.4);
    }

    .screen-glass {
      background-color: #030303;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.9), 
                  inset 0 -1px 2px rgba(255,255,255,0.2),
                  0 1px 1px rgba(255,255,255,0.7);
      border: 1px solid #111;
    }

    .metallic-header {
      background: linear-gradient(to bottom, #F4F5F7 0%, #D1D4D9 100%);
      border-bottom: 1px solid #777;
    }

    .glossy-blue {
      background: linear-gradient(to bottom, #74b8f9 0%, #4392e2 49%, #1E6DD3 50%, #2f83e5 100%);
      color: white;
      text-shadow: 0 -1px 1px rgba(0,0,0,0.4);
    }

    .click-wheel {
      background: #FAFAFA;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.15),
                  inset 0 -1px 2px rgba(255, 255, 255, 1),
                  0 1px 2px rgba(255, 255, 255, 0.9),
                  0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    .center-button {
      background: radial-gradient(circle at 30% 10%, #FFFFFF 0%, #E2E4E6 30%, #AAB0B6 100%);
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        inset 0 -1px 2px rgba(0, 0, 0, 0.25),
        0 0 0 1.5px rgba(0, 0, 0, 0.12),
        0 2px 4px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // --- 오프라인 이미지 생성기 (인터넷 없이 자체 내장 그래픽 렌더링) ---
    const getOfflineImage = (emoji, color1, color2) => {
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='200' height='210'>
        <defs>
          <linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'>
            <stop offset='0%' stop-color='${color1}'/>
            <stop offset='100%' stop-color='${color2}'/>
          </linearGradient>
        </defs>
        <rect width='200' height='210' fill='url(#g)'/>
        <text x='100' y='115' font-family='sans-serif' font-size='80' text-anchor='middle' dominant-baseline='middle'>${emoji}</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    };

    const getAlbumArt = (seedText) => {
      const emojis = ['💿', '🎸', '🎹', '🥁', '🎷', '📻', '🎧', '🎤'];
      const gradients = [
        ['#667eea', '#764ba2'], ['#ff9a9e', '#fecfef'], ['#84fab0', '#8fd3f4'],
        ['#a18cd1', '#fbc2eb'], ['#fccb90', '#d57eeb'], ['#e0c3fc', '#8ec5fc']
      ];
      const idx = seedText.length % emojis.length;
      const cIdx = seedText.length % gradients.length;
      return getOfflineImage(emojis[idx], gradients[cIdx][0], gradients[cIdx][1]);
    };

    const coverImages = {
      music: getOfflineImage('🎵', '#4facfe', '#00f2fe'),
      podcasts: getOfflineImage('🎙️', '#43e97b', '#38f9d7'),
      shuffle: getOfflineImage('🔀', '#fa709a', '#fee140'),
      photos: getOfflineImage('🖼️', '#f6d365', '#fda085'),
      videos: getOfflineImage('🎬', '#a18cd1', '#fbc2eb'),
      extras: getOfflineImage('✨', '#c2e9fb', '#a1c4fd'),
      settings: getOfflineImage('⚙️', '#cfd9df', '#e2ebf0'),
    };

    // --- 한국어 더미 데이터 세팅 ---
    const dummyArtists = ['아이팟 밴드', '콜드플레이', '다프트 펑크', '오아시스'];
    const dummyAlbums = ['명곡 모음 1집', '여름밤의 어쿠스틱', '베스트 컬렉션', '드라이브 뮤직'];

    const dummySongs = Array.from({ length: 30 }, (_, i) => {
      const artist = dummyArtists[i % dummyArtists.length];
      const album = dummyAlbums[i % dummyAlbums.length];
      return {
        id: i,
        label: `${artist} - 트랙 ${i + 1}`,
        title: `트랙 ${i + 1}`,
        type: 'song',
        artist: artist,
        album: album,
        duration: 180 + Math.floor(Math.random() * 120),
        image: getAlbumArt(`${artist}${album}${i}`) // 오프라인 앨범 아트 할당
      };
    });

    const generateMenu = (id, title, items, split = false) => ({ id, title, items, split });

    const getArtistsMenu = () => {
      const items = dummyArtists.map(artist => ({
        label: artist,
        type: 'dynamic',
        target: 'songs',
        image: getAlbumArt(artist),
        action: () => generateMenu(`artist_${artist}`, artist, dummySongs.filter(s => s.artist === artist))
      }));
      return generateMenu('artists', '아티스트', items);
    };

    const getAlbumsMenu = () => {
      const items = dummyAlbums.map(album => ({
        label: album,
        type: 'dynamic',
        target: 'songs',
        image: getAlbumArt(album),
        action: () => generateMenu(`album_${album}`, album, dummySongs.filter(s => s.album === album))
      }));
      return generateMenu('albums', '앨범', items);
    };

    const initialSubMenus = {
      music: generateMenu('music', '음악', [
        { label: '재생목록', target: 'empty', image: coverImages.music },
        { label: '아티스트', type: 'dynamic', action: getArtistsMenu, image: coverImages.podcasts },
        { label: '앨범', type: 'dynamic', action: getAlbumsMenu, image: coverImages.extras },
        { label: '모든 노래', target: 'songs', image: coverImages.shuffle },
      ], true), 
      songs: generateMenu('songs', '모든 노래', dummySongs),
      settings: generateMenu('settings', '설정', [
        { label: '정보', target: 'about' },
        { label: '화면 밝기', target: 'brightness' },
        { label: '주메뉴', target: 'empty' },
      ]),
      about: generateMenu('about', '정보', []), 
      brightness: generateMenu('brightness', '화면 밝기', []), 
      nowplaying: generateMenu('nowplaying', '지금 재생 중', []), 
      empty: generateMenu('empty', '준비 중', [{ label: '항목이 없습니다.', target: null }])
    };

    // 최상위 메인 메뉴
    const menuData = generateMenu('root', 'iPod', [
      { label: '음악', target: 'music', image: coverImages.music },
      { label: '비디오', target: 'empty', image: coverImages.videos },
      { label: '사진', target: 'empty', image: coverImages.photos },
      { label: '팟캐스트', target: 'empty', image: coverImages.podcasts },
      { label: '기타', target: 'empty', image: coverImages.extras },
      { label: '설정', target: 'settings', image: coverImages.settings },
      { label: '노래 임의재생', type: 'shuffle', image: coverImages.shuffle },
      { label: '지금 재생 중', target: 'nowplaying', image: coverImages.music }
    ], true); 

    // --- 커스텀 우측 분할 화면 컴포넌트 ---
    const RightPaneRenderer = ({ item }) => {
      if (!item) return <div className="w-full h-full bg-[#EAEAEA]" />;
      
      const label = item.label;

      if (label === '설정') {
        return (
          <div className="w-full h-full bg-gradient-to-b from-[#182A40] to-[#0A1018] flex flex-col items-center justify-between py-3 relative shadow-[inset_3px_0_8px_rgba(0,0,0,0.4)]">
            <span className="text-[#8BA1B8] font-bold text-[10px] tracking-widest mt-2">iPod</span>
            <svg width="44" height="52" viewBox="0 0 384 512" fill="#D0D5DB" className="opacity-90">
              <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
            </svg>
            <div className="w-[85%] flex flex-col items-center gap-1 mb-1">
              <div className="w-full h-[6px] bg-[#111] rounded-full border border-[#222] relative overflow-hidden shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)]">
                <div className="absolute left-0 top-0 h-full w-[25%] bg-gradient-to-b from-[#E0E0E0] to-[#909090]"></div>
              </div>
              <span className="text-[#8BA1B8] font-bold text-[9px]">99.5 GB 남음</span>
            </div>
          </div>
        );
      }

      if (label === '사진') {
        return (
          <div className="w-full h-full bg-gradient-to-b from-[#5C6E7E] to-[#3C4D5D] flex flex-col items-center justify-center relative shadow-[inset_3px_0_8px_rgba(0,0,0,0.4)]">
            <div className="relative w-20 h-20 mt-2">
              <div className="absolute top-1 left-2 w-[48px] h-[54px] bg-[#F0F0F0] shadow-md transform -rotate-[15deg] flex flex-col p-1 border border-gray-300">
                <div className="flex-1 bg-[#8EA2B3]"></div>
                <div className="h-[8px]"></div>
              </div>
              <div className="absolute top-4 left-6 w-[48px] h-[54px] bg-[#FDFDFD] shadow-lg transform rotate-[8deg] flex flex-col p-1 border border-gray-200">
                <div className="flex-1 bg-[#C0D0E0] flex items-center justify-center overflow-hidden">
                   <span className="text-[28px] opacity-80">🌴</span>
                </div>
                <div className="h-[8px]"></div>
              </div>
            </div>
            <span className="text-white font-bold text-[11px] drop-shadow-md mt-3">사진 없음</span>
          </div>
        );
      }

      // 자체 생성된 오프라인 이미지를 렌더링
      return (
        <div className="w-full h-full relative shadow-[inset_3px_0_6px_rgba(0,0,0,0.3)] bg-white flex items-center justify-center">
           <img src={item.image || getAlbumArt(label)} className="w-full h-full object-cover" />
        </div>
      );
    };

    // --- 아이콘 컴포넌트 ---
    const PlayPauseIcon = ({ className }) => (
      <svg width="17" height="10" viewBox="0 0 24 16" fill="currentColor" className={className}>
        <polygon points="0,1 11,8 0,15" />
        <rect x="14" y="1" width="3.5" height="14" />
        <rect x="20.5" y="1" width="3.5" height="14" />
      </svg>
    );
    const PrevIcon = ({ className }) => (
      <svg width="19" height="11" viewBox="0 0 24 16" fill="currentColor" className={className}>
        <rect x="0" y="1" width="3" height="14" />
        <polygon points="3,8 13,1 13,15" />
        <polygon points="13,8 23,1 23,15" />
      </svg>
    );
    const NextIcon = ({ className }) => (
      <svg width="19" height="11" viewBox="0 0 24 16" fill="currentColor" className={className}>
        <polygon points="11,8 1,1 1,15" />
        <polygon points="21,8 11,1 11,15" />
        <rect x="21" y="1" width="3" height="14" />
      </svg>
    );
    
    // 배터리 저전력 경고 로직이 적용된 리얼 배터리 아이콘
    const BatteryIcon = ({ level, isCharging }) => {
      // 20% 이하: 경고 빨간색 / 그 외: 스탠다드 회색 / 충전중: 초록색
      let gradientClass = 'from-[#A0A0A0] to-[#555]';
      if (isCharging) {
        gradientClass = 'from-[#7CE052] to-[#48B021]';
      } else if (level <= 20) {
        gradientClass = 'from-[#FF4B4B] to-[#D31818]';
      }

      return (
        <div className="w-[19px] h-[10px] border border-[#555] rounded-[2px] p-[1px] relative flex bg-white shadow-[0_1px_1px_rgba(255,255,255,0.8)] overflow-hidden shrink-0">
          <div className={`h-full rounded-[1px] transition-all bg-gradient-to-b ${gradientClass}`} style={{ width: `${Math.max(level, 3)}%` }}></div>
          <div className="absolute -right-[2px] top-[2px] w-[2px] h-[4px] bg-[#555] rounded-r-[1px]"></div>
          {isCharging && (
            <svg width="6" height="8" viewBox="0 0 24 24" fill="#fff" className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 drop-shadow-md z-10">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
          )}
        </div>
      );
    };
    
    const FilledChevron = ({ className }) => (
      <svg width="6" height="9" viewBox="0 0 6 10" fill="currentColor" className={className}>
        <polygon points="0,0 6,5 0,10" />
      </svg>
    );
    
    const EarphoneIcon = ({ className }) => (
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
      </svg>
    );

    function App() {
      const [menuStack, setMenuStack] = useState([menuData]);
      const [selectedIndex, setSelectedIndex] = useState(0);
      const [scrollOffset, setScrollOffset] = useState(0); 
      const [isSelectionActive, setIsSelectionActive] = useState(false); 
      
      const [time, setTime] = useState('12:00');
      const [battery, setBattery] = useState(85);
      const [brightness, setBrightness] = useState(100);
      const [isScreenOff, setIsScreenOff] = useState(false);
      
      const [isCharging, setIsCharging] = useState(false);
      const [isEarphonesConnected, setIsEarphonesConnected] = useState(false);

      const [isPlaying, setIsPlaying] = useState(false);
      const [currentSong, setCurrentSong] = useState(null);
      const [currentPlaylist, setCurrentPlaylist] = useState([]);
      const [progress, setProgress] = useState(0);
      const [volume, setVolume] = useState(50);
      const [nowPlayingMode, setNowPlayingMode] = useState('volume');

      const [isInteracting, setIsInteracting] = useState(false);
      const [activeButton, setActiveButton] = useState(null);
      
      const wheelRef = useRef(null);
      const interactionState = useRef({ prevAngle: null, accumulatedDelta: 0 });
      const wheelScrollAccumulator = useRef(0);
      const audioCtxRef = useRef(null);
      const sleepTimerRef = useRef(null);

      const currentMenu = menuStack[menuStack.length - 1];
      
      const ITEM_HEIGHT = 22; 
      const VISIBLE_ITEMS = 8; 
      
      const isMenuScreen = !['nowplaying', 'about', 'brightness'].includes(currentMenu.id);
      const showSplitView = isMenuScreen && currentMenu.split && isSelectionActive;

      // --- 실제 하드웨어 완벽 연동 로직 시작 ---

      useEffect(() => {
        const updateTime = () => setTime(new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit', hour12: true }));
        updateTime();
        const intv = setInterval(updateTime, 1000);
        return () => clearInterval(intv);
      }, []);

      // 배터리 및 저전력 모드 연동
      useEffect(() => {
        let batteryObj = null;
        const updateBattery = () => {
          if(batteryObj) {
            setBattery(Math.floor(batteryObj.level * 100));
            setIsCharging(batteryObj.charging);
            
            // 배터리가 10% 이하라면 밝기를 강제로 조금 낮춰 저전력 모드 흉내
            if (batteryObj.level <= 0.1 && !batteryObj.charging) {
               setBrightness(prev => Math.min(prev, 60));
            }
          }
        };

        if ('getBattery' in navigator) {
          navigator.getBattery().then(b => {
            batteryObj = b;
            updateBattery();
            b.addEventListener('levelchange', updateBattery);
            b.addEventListener('chargingchange', updateBattery);
          }).catch(err => console.log('Battery API not available:', err));
        }
        return () => {
          if(batteryObj) {
            batteryObj.removeEventListener('levelchange', updateBattery);
            batteryObj.removeEventListener('chargingchange', updateBattery);
          }
        }
      }, []);

      // 이어폰 연결 상태 연동
      useEffect(() => {
        const checkAudioDevices = async () => {
          if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
          try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const hasHeadphones = devices.some(device => {
              if (device.kind !== 'audiooutput') return false;
              const label = device.label.toLowerCase();
              return label.includes('headphone') || label.includes('airpods') || 
                     label.includes('earpods') || label.includes('buds') || 
                     label.includes('bose') || label.includes('sony') || 
                     label.includes('bluetooth') || label.includes('usb audio');
            });
            setIsEarphonesConnected(hasHeadphones);
          } catch (err) {
            console.log('Audio devices error:', err);
          }
        };
        checkAudioDevices();
        if (navigator.mediaDevices) navigator.mediaDevices.addEventListener('devicechange', checkAudioDevices);
        
        return () => {
          if (navigator.mediaDevices) navigator.mediaDevices.removeEventListener('devicechange', checkAudioDevices);
        };
      }, []);

      // --- 하드웨어 연동 로직 종료 ---

      useEffect(() => {
        let intv;
        if (isPlaying && currentSong) {
          intv = setInterval(() => {
            setProgress(p => {
              if (p >= currentSong.duration) {
                handleNextSong();
                return 0;
              }
              return p + 1;
            });
          }, 1000);
        }
        return () => clearInterval(intv);
      }, [isPlaying, currentSong]);

      useEffect(() => {
        if (selectedIndex < scrollOffset) {
          setScrollOffset(selectedIndex);
        } else if (selectedIndex >= scrollOffset + VISIBLE_ITEMS) {
          setScrollOffset(selectedIndex - VISIBLE_ITEMS + 1);
        }
      }, [selectedIndex, scrollOffset]);

      const resetSleepTimer = useCallback(() => {
        if (isScreenOff) setIsScreenOff(false);
        if (sleepTimerRef.current) clearTimeout(sleepTimerRef.current);
        sleepTimerRef.current = setTimeout(() => setIsScreenOff(true), 15000);
      }, [isScreenOff]);

      useEffect(() => {
        resetSleepTimer();
        return () => clearTimeout(sleepTimerRef.current);
      }, [resetSleepTimer]);

      const playTick = useCallback(() => {
        try {
          if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') ctx.resume();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.03, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.02);
        } catch(e) { } 
      }, []);

      const getAngleFromPoint = (clientX, clientY, rect) => {
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        return Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
      };

      const getEventPoint = (e) => {
        const touch = e.touches?.[0] || e.changedTouches?.[0];
        if (touch) return { clientX: touch.clientX, clientY: touch.clientY };
        return { clientX: e.clientX, clientY: e.clientY };
      };

      const handleStart = (e) => {
        if (e.pointerType === 'touch') return;
        resetSleepTimer();
        if (isScreenOff) return;
        if (e.target.closest('.wheel-btn') || e.target.id === 'center-btn') return;
        if (wheelRef.current) {
          const rect = wheelRef.current.getBoundingClientRect();
          const point = getEventPoint(e);
          interactionState.current.prevAngle = getAngleFromPoint(point.clientX, point.clientY, rect);
          interactionState.current.accumulatedDelta = 0;
          setIsInteracting(true);
        }
      };

      const processScroll = useCallback((direction) => {
        playTick();

        if (currentMenu.id === 'nowplaying') {
          if (nowPlayingMode === 'volume') {
            setVolume(prev => Math.min(Math.max(prev + (direction > 0 ? -5 : 5), 0), 100));
          } else {
            if (currentSong) setProgress(prev => Math.min(Math.max(prev + (direction > 0 ? -5 : 5), 0), currentSong.duration));
          }
        } else if (currentMenu.id === 'brightness') {
          setBrightness(prev => Math.min(Math.max(prev + (direction > 0 ? -10 : 10), 20), 100));
        } else if (currentMenu.items && currentMenu.items.length > 0) {
          if (!isSelectionActive) {
            setIsSelectionActive(true);
          } else {
            const nextIndex = direction > 0
              ? Math.max(selectedIndex - 1, 0)
              : Math.min(selectedIndex + 1, currentMenu.items.length - 1);

            if (nextIndex !== selectedIndex) {
              setSelectedIndex(nextIndex);
            }
          }
        }
      }, [currentMenu.id, currentMenu.items, isSelectionActive, selectedIndex, nowPlayingMode, currentSong, playTick]);

      const handleMove = useCallback((e) => {
        if (e.pointerType === 'touch') return;
        if (!isInteracting || !wheelRef.current || isScreenOff) return;
        resetSleepTimer();

        const rect = wheelRef.current.getBoundingClientRect();
        const point = getEventPoint(e);
        const currentAngle = getAngleFromPoint(point.clientX, point.clientY, rect);
        const prevAngle = interactionState.current.prevAngle;

        if (prevAngle !== null) {
          let delta = currentAngle - prevAngle;
          if (delta > 180) delta -= 360;
          else if (delta < -180) delta += 360;

          interactionState.current.accumulatedDelta += delta;
          const sensitivity = 15; 

          if (Math.abs(interactionState.current.accumulatedDelta) > sensitivity) {
            processScroll(interactionState.current.accumulatedDelta > 0 ? -1 : 1);
            interactionState.current.accumulatedDelta = 0;
          }
        }
        interactionState.current.prevAngle = currentAngle;
        if (e.cancelable) e.preventDefault();
      }, [isInteracting, isScreenOff, processScroll, resetSleepTimer]);

      const handleEnd = useCallback(() => {
        setIsInteracting(false);
        interactionState.current.prevAngle = null;
        setActiveButton(null);
      }, []);

      useEffect(() => {
        const wheel = wheelRef.current;
        if (!wheel) return;

        const handleTouchStart = (e) => {
          resetSleepTimer();
          if (isScreenOff) return;
          if (e.target.closest('.wheel-btn') || e.target.id === 'center-btn') return;
          if (!e.touches?.[0]) return;

          const rect = wheel.getBoundingClientRect();
          const point = getEventPoint(e);
          interactionState.current.prevAngle = getAngleFromPoint(point.clientX, point.clientY, rect);
          interactionState.current.accumulatedDelta = 0;
          setIsInteracting(true);
          if (e.cancelable) e.preventDefault();
        };

        const handleTouchMove = (e) => {
          if (!e.touches?.[0] || isScreenOff) return;
          resetSleepTimer();

          const rect = wheel.getBoundingClientRect();
          const point = getEventPoint(e);
          const currentAngle = getAngleFromPoint(point.clientX, point.clientY, rect);
          const prevAngle = interactionState.current.prevAngle;

          if (prevAngle !== null) {
            let delta = currentAngle - prevAngle;
            if (delta > 180) delta -= 360;
            else if (delta < -180) delta += 360;

            interactionState.current.accumulatedDelta += delta;
            const sensitivity = 15;

            if (Math.abs(interactionState.current.accumulatedDelta) > sensitivity) {
              processScroll(interactionState.current.accumulatedDelta > 0 ? -1 : 1);
              interactionState.current.accumulatedDelta = 0;
            }
          }
          interactionState.current.prevAngle = currentAngle;
          if (e.cancelable) e.preventDefault();
        };

        wheel.addEventListener('touchstart', handleTouchStart, { passive: false });
        wheel.addEventListener('touchmove', handleTouchMove, { passive: false });
        wheel.addEventListener('touchend', handleEnd, { passive: false });
        wheel.addEventListener('touchcancel', handleEnd, { passive: false });

        return () => {
          wheel.removeEventListener('touchstart', handleTouchStart);
          wheel.removeEventListener('touchmove', handleTouchMove);
          wheel.removeEventListener('touchend', handleEnd);
          wheel.removeEventListener('touchcancel', handleEnd);
        };
      }, [handleEnd, isScreenOff, processScroll, resetSleepTimer]);

      const handleNativeWheel = useCallback((e) => {
        if (isScreenOff) return resetSleepTimer();
        resetSleepTimer();
        wheelScrollAccumulator.current += e.deltaY;
        const sensitivity = 40; 
        if (Math.abs(wheelScrollAccumulator.current) > sensitivity) {
          processScroll(wheelScrollAccumulator.current > 0 ? -1 : 1);
          wheelScrollAccumulator.current = 0;
        }
      }, [isScreenOff, processScroll, resetSleepTimer]);

      useEffect(() => {
        const handleGlobalMouseUp = () => handleEnd();
        window.addEventListener('mouseup', handleGlobalMouseUp);
        return () => window.removeEventListener('mouseup', handleGlobalMouseUp);
      }, [handleEnd]);

      const handleNextSong = () => {
        if (currentPlaylist.length > 0 && currentSong) {
          const idx = currentPlaylist.findIndex(s => s.id === currentSong.id);
          setCurrentSong(currentPlaylist[(idx + 1) % currentPlaylist.length]);
          setProgress(0); setIsPlaying(true);
        }
      };

      const handlePrevSong = () => {
        if (progress > 3) {
          setProgress(0);
        } else if (currentPlaylist.length > 0 && currentSong) {
          const idx = currentPlaylist.findIndex(s => s.id === currentSong.id);
          setCurrentSong(currentPlaylist[(idx - 1 + currentPlaylist.length) % currentPlaylist.length]);
          setProgress(0); setIsPlaying(true);
        }
      };

      const handleWheelAction = (action) => {
        resetSleepTimer();
        if (isScreenOff) return;
        setActiveButton(action);
        playTick();
        setTimeout(() => setActiveButton(null), 150);

        if (action === 'menu') {
          setIsSelectionActive(false); 
          if (menuStack.length > 1) {
            setMenuStack((prev) => prev.slice(0, -1));
            setSelectedIndex(0);
            setScrollOffset(0);
          }
        } else if (action === 'playpause') {
          if (currentSong) setIsPlaying(!isPlaying);
        } else if (action === 'next') {
          if (currentSong) handleNextSong();
        } else if (action === 'prev') {
          if (currentSong) handlePrevSong();
        } else if (action === 'center') {
          if (currentMenu.id === 'nowplaying') {
            setNowPlayingMode(prev => prev === 'volume' ? 'scrub' : 'volume');
            return;
          }
          if (currentMenu.id === 'about' || currentMenu.id === 'brightness') return;
          if (!isSelectionActive) {
            setIsSelectionActive(true);
            return;
          }

          const selectedItem = currentMenu.items[selectedIndex];
          if (selectedItem) {
            if (selectedItem.type === 'song') {
              setCurrentPlaylist(currentMenu.items.filter(i => i.type === 'song'));
              setCurrentSong(selectedItem);
              setIsPlaying(true); setProgress(0);
              setMenuStack(prev => [...prev, initialSubMenus['nowplaying']]);
              setIsSelectionActive(false); 
            } else if (selectedItem.type === 'shuffle') {
              const shuffled = [...dummySongs].sort(() => Math.random() - 0.5);
              setCurrentPlaylist(shuffled);
              setCurrentSong(shuffled[0]);
              setIsPlaying(true); setProgress(0);
              setMenuStack(prev => [...prev, initialSubMenus['nowplaying']]);
              setIsSelectionActive(false);
            } else if (selectedItem.type === 'dynamic') {
              setMenuStack(prev => [...prev, selectedItem.action()]);
              setSelectedIndex(0); setScrollOffset(0);
              setIsSelectionActive(false);
            } else if (selectedItem.target) {
              const nextMenu = initialSubMenus[selectedItem.target] || initialSubMenus['empty'];
              setMenuStack((prev) => [...prev, nextMenu]);
              setSelectedIndex(0); setScrollOffset(0);
              setIsSelectionActive(false);
            }
          }
        }
      };

      const handleWheelButtonDown = (e, action) => {
        e.stopPropagation();
        resetSleepTimer();
        if (isScreenOff) return;
        setActiveButton(action);
      };

      const handleWheelButtonUp = (e, action) => {
        e.stopPropagation();
        handleWheelAction(action);
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const ScreenHeader = () => (
        <div className="metallic-header px-[6px] flex justify-between items-center z-20 shrink-0 h-[22px] w-full">
          <div className="flex justify-start items-center gap-1">
            <span className="font-extrabold text-[12px] tracking-tight">iPod</span>
            {isPlaying && <PlayPauseIcon className="w-[10px] h-[8px] text-[#3B99D8]" />}
            {isEarphonesConnected && <EarphoneIcon className="text-black opacity-60 ml-[2px]" />}
          </div>
          <div className="flex justify-end items-center">
            <BatteryIcon level={battery} isCharging={isCharging} />
          </div>
        </div>
      );

      return (
        <div className="w-full flex justify-center items-center">

          {/* 기기 전체 래퍼 (정확한 1:1.68 비율인 340x570 사용) */}
          <div className="relative flex items-center justify-center w-[340px] h-[570px]">

            {/* 충전 케이블 애니메이션 */}
            <div className={`absolute top-[100%] left-1/2 -translate-x-1/2 flex flex-col items-center transition-all duration-[600ms] ease-out z-0 ${isCharging ? 'translate-y-[-20px] opacity-100' : 'translate-y-[50px] opacity-0 pointer-events-none'}`}>
              <div className="relative flex flex-col items-center w-full">
                <div className="w-[78px] flex justify-between absolute top-[-2px] left-1/2 -translate-x-1/2">
                  <div className="w-[3px] h-[3px] bg-[#888] rounded-t-[1px]"></div>
                  <div className="w-[3px] h-[3px] bg-[#888] rounded-t-[1px]"></div>
                </div>
                <div className="w-[74px] h-[20px] bg-gradient-to-r from-[#9A9A9A] via-[#EEEEEE] to-[#9A9A9A] border-x border-t border-[#7A7A7A] rounded-t-[2px] shadow-[inset_0_1px_1px_rgba(255,255,255,0.9)] flex justify-center items-end pb-[4px] gap-[20px] relative z-10">
                  <div className="w-[6px] h-[10px] bg-gradient-to-b from-[#666] to-[#A0A0A0] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)] border border-[#555] rounded-[1.5px] relative overflow-hidden">
                    <div className="w-full h-[3px] bg-[#222] absolute top-0"></div>
                  </div>
                  <div className="w-[6px] h-[10px] bg-gradient-to-b from-[#666] to-[#A0A0A0] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)] border border-[#555] rounded-[1.5px] relative overflow-hidden">
                    <div className="w-full h-[3px] bg-[#222] absolute top-0"></div>
                  </div>
                </div>
              </div>
              <div className="w-[124px] h-[46px] bg-gradient-to-b from-[#FFFFFF] to-[#F2F2F2] rounded-[4px] border border-[#C5C5C5] shadow-[0_3px_5px_rgba(0,0,0,0.1)] flex items-center justify-center relative z-20">
                <div className="absolute top-0 w-full h-[1px] bg-white/90 rounded-t-[4px]"></div>
                <div className="w-[30px] h-[11px] border-[1.5px] border-[#A8A8A8] rounded-[2.5px] flex items-center justify-center">
                  <div className="w-[14px] h-[1.5px] bg-[#A8A8A8]"></div>
                </div>
              </div>
              <div className="w-[20px] h-[36px] bg-gradient-to-r from-[#DFDFDF] via-[#FFFFFF] to-[#DFDFDF] border-x border-[#C8C8C8] shadow-[inset_0_2px_3px_rgba(0,0,0,0.05)] rounded-b-[3px] relative z-10 -mt-[1px]"></div>
              <div className="w-[14px] h-[400px] bg-gradient-to-r from-[#D5D5D5] via-[#FFFFFF] to-[#D5D5D5] shadow-sm border-x border-[#CDCDCD] -mt-[1px]"></div>
            </div>

            {/* 이어폰 케이블 애니메이션 */}
            <div className={`absolute bottom-[100%] right-[35px] flex flex-col items-center transition-all duration-[600ms] ease-out z-0 ${isEarphonesConnected ? 'translate-y-[41px] opacity-100' : 'translate-y-[-50px] opacity-0 pointer-events-none'}`}>
              <div className="w-[10px] h-[400px] bg-gradient-to-r from-[#D0D0D0] via-[#F8F8F8] to-[#D0D0D0] shadow-sm"></div>
              <div className="w-[14px] h-[35px] bg-gradient-to-r from-[#E0E0E0] via-[#FDFDFD] to-[#E0E0E0] rounded-t-[4px] border border-[#CDCDCD] shadow-sm"></div>
              <div className="w-[22px] h-[36px] bg-gradient-to-r from-[#EEEEEE] via-[#FFFFFF] to-[#E5E5E5] rounded-[3px] border border-[#B5B5B5] shadow-[0_2px_5px_rgba(0,0,0,0.15)] relative">
                <div className="absolute bottom-[0px] w-full h-[1.5px] bg-black/15"></div>
              </div>
              <div className="w-[14px] h-[3px] bg-gradient-to-r from-[#999] via-[#E0E0E0] to-[#888] border border-[#777] rounded-b-[1.5px]"></div>
              <div className="w-[10px] h-[32px] bg-gradient-to-r from-[#999] via-[#F5F5F5] to-[#888] flex flex-col items-center justify-evenly border-x border-[#888] relative">
                <div className="w-full h-[2.5px] bg-[#222]"></div>
                <div className="w-full h-[2.5px] bg-[#222]"></div>
                <div className="w-full h-[2.5px] bg-[#222]"></div>
              </div>
              <div className="w-[6px] h-[6px] bg-gradient-to-r from-[#888] via-[#E0E0E0] to-[#777] rounded-b-[6px] shadow-inner"></div>
            </div>

            {/* 아노다이징 알루미늄 바디 */}
            <div className="w-full h-full rounded-[32px] flex flex-col items-center pt-[28px] relative device-body z-10 isolate">
              
              {/* 스크린 유리 베젤 (리얼 비율 290x220) */}
              <div className="w-[290px] h-[220px] rounded-[10px] screen-glass p-[4px] flex items-center justify-center relative overflow-hidden shrink-0">
                
                {/* 내부 LCD 화면 (282x212) */}
                <div className="w-full h-full bg-white relative overflow-hidden transition-opacity duration-300 flex flex-col rounded-[2px]" style={{ opacity: isScreenOff ? 0 : 1, filter: `brightness(${brightness}%)` }}>
                  
                  {isMenuScreen ? (
                    <div className="w-full h-full flex relative">
                      
                      <div className={`transition-all duration-300 ease-in-out ${showSplitView ? 'w-[50%] border-r border-[#888]' : 'w-full'} h-full flex flex-col z-10 bg-white relative`}>
                        <ScreenHeader />
                        <div className="flex-1 bg-white relative overflow-hidden">
                          <div className="w-full absolute left-0 top-0 transition-transform duration-75" style={{ transform: `translateY(-${scrollOffset * ITEM_HEIGHT}px)` }}>
                            {currentMenu.items?.map((item, index) => {
                              const isSelected = isSelectionActive && selectedIndex === index;
                              return (
                                <div 
                                  key={index} 
                                  className={`pl-[10px] pr-[6px] flex justify-between items-center text-[14px] font-bold ${isSelected ? 'glossy-blue' : 'text-black'}`}
                                  style={{ height: `${ITEM_HEIGHT}px` }}
                                >
                                  <span className="truncate pr-1 flex-1">{item.label}</span>
                                  {(item.target || item.type === 'sub' || item.type === 'dynamic' || item.type === 'shuffle') && (
                                    <span className="opacity-100 flex items-center">
                                      <FilledChevron className={isSelected ? 'text-white' : 'text-black'} />
                                    </span>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>

                      <div className={`absolute right-0 top-0 h-full bg-white flex items-center justify-center overflow-hidden transition-all duration-300 ease-in-out ${showSplitView ? 'w-[50%] translate-x-0 opacity-100' : 'w-[50%] translate-x-[30%] opacity-0 pointer-events-none'}`}>
                         <RightPaneRenderer item={currentMenu.items?.[selectedIndex]} />
                      </div>
                    </div>

                  ) : currentMenu.id === 'nowplaying' ? (
                    <div className="w-full h-full bg-white flex flex-col">
                      <ScreenHeader />
                      {currentSong ? (
                        <>
                          <div className="flex flex-1 p-2 items-center mt-1">
                            <div className="w-[100px] h-[100px] bg-gradient-to-br from-blue-300 to-purple-400 shadow-md border border-gray-200 flex items-center justify-center shrink-0 ml-1 aspect-square overflow-hidden">
                              <img src={currentSong.image} className="w-full h-full object-cover" alt="album art" />
                            </div>
                            <div className="flex-1 ml-4 flex flex-col justify-center gap-[2px] overflow-hidden">
                              <div className="font-extrabold truncate text-[15px]">{currentSong.title}</div>
                              <div className="text-gray-700 font-bold truncate text-[13px]">{currentSong.artist}</div>
                              <div className="text-gray-500 font-bold truncate text-[12px]">{currentSong.album}</div>
                              <div className="text-[11px] text-[#3B99D8] font-bold mt-1">
                                {currentPlaylist.findIndex(s=>s.id===currentSong.id)+1} / {currentPlaylist.length}
                              </div>
                            </div>
                          </div>
                          <div className="px-3 pb-4">
                            <div className="flex justify-between text-[11px] text-gray-500 font-bold mb-1">
                              {nowPlayingMode === 'scrub' ? (
                                <><span>{formatTime(progress)}</span><span className="text-[#3B99D8]">탐색 중</span><span>-{formatTime(currentSong.duration - progress)}</span></>
                              ) : (
                                <><span></span><span className="text-gray-600">볼륨</span><span></span></>
                              )}
                            </div>
                            <div className="w-full h-[8px] bg-gray-300 border border-gray-400 overflow-hidden relative shadow-inner">
                              {nowPlayingMode === 'scrub' ? (
                                <div className="h-full bg-gradient-to-b from-[#6cbaf8] to-[#3B99D8]" style={{ width: `${(progress / currentSong.duration) * 100}%` }}></div>
                              ) : (
                                <div className="h-full bg-gradient-to-b from-[#888] to-[#555]" style={{ width: `${volume}%` }}></div>
                              )}
                            </div>
                          </div>
                        </>
                      ) : (
                        <div className="flex-1 flex items-center justify-center text-sm font-bold text-gray-500">음악을 선택해주세요</div>
                      )}
                    </div>

                  ) : currentMenu.id === 'about' ? (
                    <div className="w-full h-full bg-white flex flex-col text-[13px]">
                      <ScreenHeader />
                      <div className="p-4 flex flex-col gap-2 font-bold">
                        <div className="flex justify-between border-b border-gray-200 pb-1"><span>이름</span><span className="text-[#3B99D8]">My iPod</span></div>
                        <div className="flex justify-between border-b border-gray-200 pb-1"><span>용량</span><span className="text-gray-600">160 GB</span></div>
                        <div className="flex justify-between border-b border-gray-200 pb-1"><span>사용 가능</span><span className="text-gray-600">142.3 GB</span></div>
                        <div className="flex justify-between border-b border-gray-200 pb-1"><span>버전</span><span className="text-gray-600">2.0.4 PC</span></div>
                        <div className="flex justify-between border-b border-gray-200 pb-1"><span>모델</span><span className="text-gray-600">MC297</span></div>
                      </div>
                    </div>

                  ) : currentMenu.id === 'brightness' ? (
                    <div className="w-full h-full bg-white flex flex-col">
                      <ScreenHeader />
                      <div className="flex-1 flex flex-col items-center justify-center px-6">
                        <div className="w-full h-4 bg-gray-200 border border-gray-400 overflow-hidden flex shadow-inner">
                          <div className="h-full bg-gradient-to-b from-[#6cbaf8] to-[#3B99D8]" style={{ width: `${brightness}%` }}></div>
                        </div>
                      </div>
                    </div>
                  ) : null}
                </div>
                
                {/* 반사광 */}
                <div className="absolute top-0 left-0 w-full h-[45%] bg-gradient-to-b from-white/15 to-transparent pointer-events-none z-30 rounded-t-[6px]"></div>
              </div>

              {/* 리얼 비율 클릭 휠 (지름 200px) */}
              <div className="w-[200px] h-[200px] mt-[45px] relative">
                <div 
                  ref={wheelRef}
                  className={`w-full h-full rounded-full relative click-wheel touch-none select-none ${isInteracting ? 'cursor-grabbing' : 'cursor-grab'}`}
                  onPointerDown={handleStart}
                  onPointerMove={handleMove}
                  onPointerUp={handleEnd}
                  onPointerLeave={handleEnd}
                  onWheel={handleNativeWheel}
                >
                  <div 
                    className={`absolute top-[14px] left-1/2 -translate-x-1/2 w-16 h-8 flex items-center justify-center font-bold text-[#888888] text-[13px] tracking-[0.15em] cursor-pointer wheel-btn ${activeButton === 'menu' ? 'text-[#3B99D8] scale-95' : ''} transition-all duration-75`}
                    onPointerDown={(e) => handleWheelButtonDown(e, 'menu')}
                    onPointerUp={(e) => handleWheelButtonUp(e, 'menu')}
                  >
                    MENU
                  </div>
                  
                  <div 
                    className={`absolute bottom-[16px] left-1/2 -translate-x-1/2 w-16 h-8 flex items-center justify-center text-[#888888] cursor-pointer wheel-btn gap-1 ${activeButton === 'playpause' ? 'text-[#3B99D8] scale-95' : ''} transition-all duration-75`}
                    onPointerDown={(e) => handleWheelButtonDown(e, 'playpause')}
                    onPointerUp={(e) => handleWheelButtonUp(e, 'playpause')}
                  >
                    <PlayPauseIcon className="opacity-90" />
                  </div>

                  <div 
                    className={`absolute left-[16px] top-1/2 -translate-y-1/2 w-8 h-16 flex items-center justify-center text-[#888888] cursor-pointer wheel-btn ${activeButton === 'prev' ? 'text-[#3B99D8] scale-95' : ''} transition-all duration-75`}
                    onPointerDown={(e) => handleWheelButtonDown(e, 'prev')}
                    onPointerUp={(e) => handleWheelButtonUp(e, 'prev')}
                  >
                    <PrevIcon className="opacity-90" />
                  </div>

                  <div 
                    className={`absolute right-[16px] top-1/2 -translate-y-1/2 w-8 h-16 flex items-center justify-center text-[#888888] cursor-pointer wheel-btn ${activeButton === 'next' ? 'text-[#3B99D8] scale-95' : ''} transition-all duration-75`}
                    onPointerDown={(e) => handleWheelButtonDown(e, 'next')}
                    onPointerUp={(e) => handleWheelButtonUp(e, 'next')}
                  >
                    <NextIcon className="opacity-90" />
                  </div>

                  {/* 센터 버튼 (지름 64px, 기기 몸체와 동일한 조명/질감) */}
                  <div 
                    id="center-btn"
                    className="absolute top-1/2 left-1/2 w-[64px] h-[64px] rounded-full center-button flex items-center justify-center cursor-pointer transition-all duration-75"
                    style={{
                      transform: `translate(-50%, -50%) scale(${activeButton === 'center' ? 0.96 : 1})`,
                      filter: activeButton === 'center' ? 'brightness(0.9)' : 'none'
                    }}
                    onPointerDown={(e) => handleWheelButtonDown(e, 'center')}
                    onPointerUp={(e) => handleWheelButtonUp(e, 'center')}
                  >
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
